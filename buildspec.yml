# CodeBuild buildspec for the toy Playwright suite.
# Runs on the official Microsoft Playwright image (browsers pre-baked).
# TEST_ENV selects dev/qa; set per CodeBuild project (this file defaults to dev).
version: 0.2

env:
  variables:
    TEST_ENV: "dev"
    PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
    CI: "true"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing project dependencies for TEST_ENV=$TEST_ENV"
      - npm ci
      # No 'playwright install' needed: browsers are baked into the image.

  build:
    commands:
      - echo "Running Playwright suite against $TEST_ENV"
      - npx playwright test || true

  post_build:
    commands:
      - echo "Build complete."
      - aws s3 sync playwright-report/ s3://playwright-reports-dev-2026/latest/ --delete

reports:
  playwright-junit:
    files:
      - "test-results/junit/results.xml"
    file-format: "JUNITXML"

artifacts:
  files:
    - "test-results/**/*"
    - "playwright-report/**/*"
  name: "playwright-results-$TEST_ENV"
